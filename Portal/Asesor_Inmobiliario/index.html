<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alejandro Varela | Luxury Real Estate Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #111111;
            --accent-gold: #c5a880;
            --text-main: #fcfcfc;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .real-estate-card {
            background: var(--card-bg);
            width: 100%; max-width: 450px;
            border: 1px solid #222;
            padding: 50px 40px;
            text-align: center;
            position: relative;
        }

        /* Líneas decorativas esquineras */
        .real-estate-card::before { content: ''; position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border-top: 1px solid var(--accent-gold); border-left: 1px solid var(--accent-gold); }
        .real-estate-card::after { content: ''; position: absolute; bottom: 10px; right: 10px; width: 40px; height: 40px; border-bottom: 1px solid var(--accent-gold); border-right: 1px solid var(--accent-gold); }

        .profile-photo { 
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover; 
            margin-bottom: 25px; border: 2px solid var(--accent-gold); padding: 3px;
        }

        h1 { 
            font-family: 'Cinzel', serif; font-size: 1.8rem; letter-spacing: 3px; 
            text-transform: uppercase; margin-bottom: 10px; 
        }

        .role-title { 
            font-size: 0.7rem; color: var(--accent-gold); letter-spacing: 5px; 
            text-transform: uppercase; margin-bottom: 40px; 
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 40px; }
        .stat-box { border-left: 1px solid #333; padding: 5px; }
        .stat-value { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .stat-label { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; }

        .cta-btn { 
            display: block; width: 100%; padding: 18px; border: 1px solid var(--accent-gold);
            color: var(--text-main); text-decoration: none; font-size: 0.75rem; 
            letter-spacing: 2px; text-transform: uppercase; transition: 0.4s;
        }
        .cta-btn:hover { background: var(--accent-gold); color: #000; }

        .contact-links { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        .contact-icon { color: var(--text-muted); font-size: 1.2rem; transition: 0.3s; }
        .contact-icon:hover { color: var(--accent-gold); }

    </style>
</head>
<body>
    <div class="real-estate-card">
        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=400" alt="Alejandro Varela" class="profile-photo">
        
        <h1>Alejandro Varela</h1>
        <div class="role-title">Luxury Real Estate Advisor</div>

        <div class="stat-grid">
            <div class="stat-box"><div class="stat-value">12+</div><div class="stat-label">Años</div></div>
            <div class="stat-box"><div class="stat-value">200+</div><div class="stat-label">Ventas</div></div>
            <div class="stat-box"><div class="stat-value">TOP</div><div class="stat-label">Rank</div></div>
        </div>

        <a href="#" class="cta-btn">Propiedades Exclusivas</a>

        <div class="contact-links">
            <a href="tel:+521234567890" class="contact-icon"><i class="fas fa-phone"></i></a>
            <a href="mailto:avarela@luxuryre.mx" class="contact-icon"><i class="fas fa-envelope"></i></a>
            <a href="#" class="contact-icon"><i class="fas fa-globe"></i></a>
        </div>
    </div>
</body>
</html>
