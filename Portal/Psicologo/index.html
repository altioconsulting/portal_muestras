<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dra. Elena Rostova | Psicólogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-canvas: #0b0f12; --glass-bg: rgba(22, 28, 33, 0.7); --accent-gold: #c5a880; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-canvas); color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .premium-card { background: var(--glass-bg); backdrop-filter: blur(20px); width: 100%; max-width: 440px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); overflow: hidden; }
        .card-header { padding: 45px 30px 25px 30px; text-align: center; }
        .profile-img { width: 124px; height: 124px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-gold); margin-bottom: 24px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 8px; }
        .clinical-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-gold); margin-bottom: 12px; }
        .cedula-badge { font-size: 0.65rem; color: #8a99a6; background: rgba(255,255,255,0.03); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .card-body { padding: 0 32px 40px 32px; }
        .section-label { font-size: 0.65rem; text-transform: uppercase; color: #8a99a6; margin: 20px 0 12px 0; display: flex; align-items: center; gap: 8px; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.05); }
        .expertise-item { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .cta-btn { display: block; width: 100%; text-align: center; background: var(--accent-gold); color: #0b0f12; padding: 14px; border-radius: 12px; font-weight: 600; text-decoration: none; }
        .comm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .comm-card { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; text-align: center; text-decoration: none; color: #f3f4f6; font-size: 0.8rem; }
        .footer { padding: 20px; text-align: center; font-size: 0.65rem; color: #8a99a6; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="premium-card">
        <div class="card-header">
            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=300" alt="Dra. Elena Rostova" class="profile-img">
            <h1>Dra. Elena Rostova</h1>
            <div class="clinical-title">Psicólogo - Psicoterapia Clínica</div>
            <div class="cedula-badge"><i class="fas fa-id-card"></i> Cédula: 9845120</div>
        </div>
        <div class="card-body">
            <div class="section-label">Especialidades</div>
            <div class="expertise-item"><i class="fas fa-brain"></i> Neuropsicoterapia</div>
            <div class="section-label">Contacto</div>
            <a href="https://wa.me/5211234567890" class="cta-btn"><i class="fab fa-whatsapp"></i> Agendar</a>
            <div class="comm-grid">
                <a href="tel:+5211234567890" class="comm-card">Llamada</a>
                <a href="mailto:contacto@clinicarostova.mx" class="comm-card">Correo</a>
            </div>
        </div>
        <div class="footer">Secreto Profesional protegido.</div>
    </div>
</body>
</html>
