<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Muestras - Tarjetas Digitales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)), 
                        url('https://lh3.googleusercontent.com/d/1Y-vHaQCKphaBJqAEmG7acL9j3v-Mj3i4');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-100 font-sans">
    <header class="py-10 px-4">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-4">
            <img src="https://lh3.googleusercontent.com/d/1p1OVv4WaedqYtjfDarZ-zKoaeS8rLu7p" alt="Logo" class="h-12 w-auto">
            <div>
                <h1 class="text-2xl font-bold text-white">Portal de Muestras</h1>
                <span class="text-xs uppercase tracking-widest text-indigo-400 font-bold">Catálogo Pro</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl w-full mx-auto p-4">
        <h2 class="text-3xl font-bold text-white mb-8">Explora nuestras soluciones digitales</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Psicólogo -->
            <a href="Psicologo/index.html" class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 hover:border-slate-500 transition-all flex flex-col gap-4">
                <i class="fa-solid fa-brain text-amber-500 text-3xl"></i>
                <div>
                    <h3 class="font-bold text-white">Psicólogo</h3>
                    <p class="text-xs text-slate-400 mt-1">Clínica & Neuropsicoterapia</p>
                </div>
            </a>

            <!-- Fotógrafo -->
            <a href="Fotografo/index.html" class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 hover:border-slate-500 transition-all flex flex-col gap-4">
                <i class="fa-solid fa-camera text-blue-400 text-3xl"></i>
                <div>
                    <h3 class="font-bold text-white">Fotógrafo</h3>
                    <p class="text-xs text-slate-400 mt-1">Retrato & Eventos</p>
                </div>
            </a>

            <!-- Asesor Inmobiliario -->
            <a href="Asesor_Inmobiliario/index.html" class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 hover:border-slate-500 transition-all flex flex-col gap-4">
                <i class="fa-solid fa-house-chimney text-emerald-500 text-3xl"></i>
                <div>
                    <h3 class="font-bold text-white">Asesor Inmobiliario</h3>
                    <p class="text-xs text-slate-400 mt-1">Bienes Raíces & Inversión</p>
                </div>
            </a>

            <!-- Abogado -->
            <a href="Abogado/index.html" class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 hover:border-slate-500 transition-all flex flex-col gap-4">
                <i class="fa-solid fa-gavel text-red-400 text-3xl"></i>
                <div>
                    <h3 class="font-bold text-white">Abogado</h3>
                    <p class="text-xs text-slate-400 mt-1">Derecho & Consultoría</p>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
