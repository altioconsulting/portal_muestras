<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Muestras - Tarjetas Digitales Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-full flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Header con Estilo Ejecutivo -->
    <header class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-800 py-5 px-4">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <span class="inline-flex items-center gap-1.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-1.5">
                    <i class="fa-solid fa-sparkles text-[10px]"></i> Catálogo Profesional
                </span>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Portal de Muestras</h1>
            </div>
            
            <!-- Botón de WhatsApp Directo para Adquirir -->
            <a href="https://wa.me/523348518401?text=Hola,%20quiero%20mi%20tarjeta%20digital" target="_blank" rel="noopener noreferrer" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2 transition-all shadow-lg shadow-emerald-600/20 cursor-pointer">
                <i class="fa-brands fa-whatsapp text-base"></i> Quiero mi tarjeta digital
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto">
        
        <!-- VISTA 1: Lista de Rubros (Catálogo Principal) -->
        <div id="catalogView" class="space-y-6">
            <div class="text-center max-w-lg mx-auto mb-8">
                <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Selecciona una especialidad</h2>
                <p class="text-slate-400 text-sm mt-1">Elige un rubro para abrir su página de tarjeta de presentación digital exclusiva.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Abogado -->
                <button onclick="openSample('abogado')" class="group bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-indigo-500/50 p-6 rounded-3xl text-left transition-all shadow-xl flex flex-col justify-between cursor-pointer">
                    <div>
                        <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-700 flex items-center justify-center text-indigo-400 mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-scale-balanced text-lg"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white group-hover:text-indigo-300 transition-colors">Abogado</h3>
                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">Derecho Corporativo & Penal</p>
                    </div>
                    <div class="mt-6 flex items-center justify-between text-xs font-semibold text-indigo-400 pt-3 border-t border-slate-700/40">
                        <span>Ver Demo</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>

                <!-- Asesor inmobiliario -->
                <button onclick="openSample('asesor')" class="group bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-amber-500/50 p-6 rounded-3xl text-left transition-all shadow-xl flex flex-col justify-between cursor-pointer">
                    <div>
                        <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-700 flex items-center justify-center text-amber-400 mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-house-chimney text-lg"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white group-hover:text-amber-300 transition-colors">Asesor inmobiliario</h3>
                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">Bienes Raíces & Inversión</p>
                    </div>
                    <div class="mt-6 flex items-center justify-between text-xs font-semibold text-amber-400 pt-3 border-t border-slate-700/40">
                        <span>Ver Demo</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>

                <!-- Dentista -->
                <button onclick="openSample('dentista')" class="group bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-teal-500/50 p-6 rounded-3xl text-left transition-all shadow-xl flex flex-col justify-between cursor-pointer">
                    <div>
                        <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-700 flex items-center justify-center text-teal-400 mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-tooth text-lg"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white group-hover:text-teal-300 transition-colors">Dentista</h3>
                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">Odontología Integral & Estética</p>
                    </div>
                    <div class="mt-6 flex items-center justify-between text-xs font-semibold text-teal-400 pt-3 border-t border-slate-700/40">
                        <span>Ver Demo</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>
            </div>
        </div>

        <!-- VISTA 2: Página Individual de Tarjeta (Catálogo Detalle) -->
        <div id="sampleView" class="hidden space-y-4">
            <!-- Botón de Regreso -->
            <button onclick="backToCatalog()" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 px-3.5 py-2 rounded-xl transition-all cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> Volver al catálogo de muestras
            </button>

            <!-- Contenedor Tarjeta -->
            <div id="cardPageContainer" class="bg-slate-800/40 backdrop-blur-md rounded-3xl shadow-2xl border border-slate-700/60 overflow-hidden">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        Portal de Muestras Pro &copy; 2026 - Tarjetas de Presentación Digitales Inteligentes
    </footer>

    <!-- Lógica de Páginas y Alerta Corregida -->
    <script>
        const samples = {
            abogado: {
                title: "Lic. Carlos Mendoza",
                subtitle: "Socio Director | Derecho Corporativo y Penal",
                badge: "Bufete Legal Verificado",
                bannerBg: "bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950",
                avatarImg: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=400",
                bio: "Especialista en derecho corporativo internacional y resolución de litigios complejos con más de 12 años de trayectoria protegiendo los intereses de empresas líderes.",
                stats: [
                    { label: "Casos Éxito", value: "+250" },
                    { label: "Experiencia", value: "12 Años" },
                    { label: "Empresas", value: "+40" }
                ],
                actions: [
                    { label: "Agendar Consulta", icon: "fa-calendar-check", color: "bg-indigo-600 hover:bg-indigo-500 text-white" },
                    { label: "WhatsApp Directo", icon: "fa-brands fa-whatsapp", color: "bg-emerald-600 hover:bg-emerald-500 text-white" },
                    { label: "V-Card / Contacto", icon: "fa-address-card", color: "bg-slate-700 hover:bg-slate-600 text-slate-200" }
                ],
                details: [
                    { label: "Ubicación", val: "Torre Corporativa Platinum, Piso 14", icon: "fa-location-dot" },
                    { label: "Correo", val: "contacto@mendozalegal.com", icon: "fa-envelope" },
                    { label: "Horario", val: "Lun - Vie: 9:00 AM - 6:00 PM", icon: "fa-clock" }
                ]
            },
            asesor: {
                title: "Valeria Fuentes",
                subtitle: "Asesora Inmobiliaria Senior & Inversiones",
                badge: "Agente Certificado VIP",
                bannerBg: "bg-gradient-to-r from-amber-950 via-slate-900 to-slate-900",
                avatarImg: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400",
                bio: "Especializada en propiedades residenciales de alta gama, desarrollos comerciales y optimización de portafolios de inversión inmobiliaria con alta rentabilidad.",
                stats: [
                    { label: "Propiedades", value: "+80 Vendidas" },
                    { label: "Clientes", value: "98% Felices" },
                    { label: "Volumen", value: "$15M+" }
                ],
                actions: [
                    { label: "Agendar Visita", icon: "fa-calendar-days", color: "bg-amber-600 hover:bg-amber-500 text-white" },
                    { label: "WhatsApp Directo", icon: "fa-brands fa-whatsapp", color: "bg-emerald-600 hover:bg-emerald-500 text-white" },
                    { label: "Ver Propiedades", icon: "fa-house", color: "bg-slate-700 hover:bg-slate-600 text-slate-200" }
                ],
                details: [
                    { label: "Oficina", val: "Boulevard Las Palmas #1200", icon: "fa-location-dot" },
                    { label: "Correo", val: "v.fuentes@inmobiliaria.com", icon: "fa-envelope" },
                    { label: "Especialidad", val: "Residencial & Comercial Exclusivo", icon: "fa-award" }
                ]
            },
            dentista: {
                title: "Dra. Sofía Rivas",
                subtitle: "Odontología Integral y Estética Avanzada",
                badge: "Clínica Dental Acreditada",
                bannerBg: "bg-gradient-to-r from-teal-950 via-slate-900 to-slate-900",
                avatarImg: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=400",
                bio: "Dedicada a transformar sonrisas con tecnología digital de vanguardia, ortodoncia invisible, diseño de sonrisa y tratamientos indoloros con máxima precisión.",
                stats: [
                    { label: "Pacientes", value: "+1,200" },
                    { label: "Valoración", value: "4.9 ★" },
                    { label: "Tecnología", value: "3D Digital" }
                ],
                actions: [
                    { label: "Agendar Cita", icon: "fa-calendar-check", color: "bg-teal-600 hover:bg-teal-500 text-white" },
                    { label: "WhatsApp Citas", icon: "fa-brands fa-whatsapp", color: "bg-emerald-600 hover:bg-emerald-500 text-white" },
                    { label: "Ubicación GPS", icon: "fa-map-location-dot", color: "bg-slate-700 hover:bg-slate-600 text-slate-200" }
                ],
                details: [
                    { label: "Clínica", val: "Centro Médico Salud, Consultorio 201", icon: "fa-location-dot" },
                    { label: "Correo", val: "citas@dra-sofiarivas.com", icon: "fa-envelope" },
                    { label: "Emergencias", val: "Urgencias dentales previa cita", icon: "fa-clock" }
                ]
            }
        };

        function openSample(key) {
            const data = samples[key];
            if (!data) return;

            document.getElementById('catalogView').classList.add('hidden');
            const sampleView = document.getElementById('sampleView');
            sampleView.classList.remove('hidden');

            const container = document.getElementById('cardPageContainer');
            container.innerHTML = `
                <!-- Cabecera / Banner -->
                <div class="${data.bannerBg} p-6 sm:p-8 relative text-white border-b border-slate-700/60">
                    <div class="absolute top-4 right-4 bg-white/10 backdrop-blur-md border border-white/20 px-3 py-1 rounded-full text-[11px] font-semibold tracking-wide flex items-center gap-1.5">
                        <i class="fa-solid fa-shield-check text-emerald-400"></i> ${data.badge}
                    </div>
                    <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5 pt-3">
                        <div class="relative">
                            <img src="${data.avatarImg}" alt="${data.title}" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover shadow-xl border-2 border-white/20">
                            <span class="absolute -bottom-2 -right-2 bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-md border-2 border-slate-900">
                                <i class="fa-solid fa-check text-[10px]"></i>
                            </span>
                        </div>
                        <div class="text-center sm:text-left pt-1">
                            <h3 class="text-2xl font-bold tracking-tight text-white">${data.title}</h3>
                            <p class="text-slate-300 text-xs sm:text-sm font-medium mt-1">${data.subtitle}</p>
                            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3 mt-3 text-xs text-slate-400">
                                <span class="flex items-center gap-1"><i class="fa-solid fa-globe text-slate-300"></i> Sitio Verificado</span>
                                <span class="flex items-center gap-1"><i class="fa-solid fa-share-nodes text-slate-300"></i> Perfil Activo</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cuerpo de la Tarjeta -->
                <div class="p-6 sm:p-8 bg-slate-900/60">
                    <p class="text-slate-300 text-sm leading-relaxed">${data.bio}</p>

                    <!-- Estadísticas Rápidas -->
                    <div class="grid grid-cols-3 gap-3 my-6">
                        ${data.stats.map(st => `
                            <div class="bg-slate-800/80 p-3.5 rounded-2xl text-center border border-slate-700/60 shadow-xs">
                                <span class="block text-[11px] uppercase tracking-wider text-slate-400 font-semibold">${st.label}</span>
                                <span class="block text-lg font-bold text-white mt-0.5">${st.value}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Detalles de Contacto -->
                    <div class="space-y-3 mb-8 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/40 text-xs sm:text-sm">
                        ${data.details.map(det => `
                            <div class="flex items-center gap-3.5 text-slate-300">
                                <span class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 text-slate-400 flex items-center justify-center text-xs shrink-0">
                                    <i class="fa-solid ${det.icon}"></i>
                                </span>
                                <span class="truncate font-medium">${det.val}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Botones de Acción Pro -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-4 border-t border-slate-800">
                        ${data.actions.map(act => `
                            <button onclick="showAlert('${act.label}')" class="${act.color} py-3 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-md cursor-pointer">
                                <i class="fa-solid ${act.icon}"></i> ${act.label}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToCatalog() {
            document.getElementById('sampleView').classList.add('hidden');
            document.getElementById('catalogView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showAlert(actionName) {
            const existingModal = document.getElementById('customAlert');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'customAlert';
            modal.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center z-50 p-4 animate-in fade-in duration-200';
            modal.innerHTML = `
                <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
                    <div class="w-14 h-14 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <h4 class="font-bold text-white text-base">Acción Demostrativa Ejecutada</h4>
                    <p class="text-slate-400 text-xs mt-1 leading-relaxed">Has seleccionado la función: <strong class="text-white">"${actionName}"</strong> en esta tarjeta digital de muestra.</p>
                    <button onclick="closeAlert()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold transition-all cursor-pointer shadow-lg shadow-indigo-600/20">Entendido</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeAlert() {
            const modal = document.getElementById('customAlert');
            if (modal) modal.remove();
        }
    </script>
</body>
</html>
